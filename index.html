  <script>
    // Get trip room ID from URL parameters or fallback to default
    const urlParams = new URLSearchParams(window.location.search);
    const tripRoomId = urlParams.get('trip') || 'singapore-3d2n-trip';

    // User provided Google Apps Script Web App URL connected to Google Sheets
    const GAS_WEB_APP_URL = ‘https://script.google.com/macros/s/AKfycbyc-3RCgkm8ohFwiGI2ph1dTzOxjNjWisNKwxzzyI6_pZBOVrJpZI4kE89m1Wu2y3dcsQ/exec’;

    window.GoogleSheetsStorage = {
      isReady: false,
      currentRoomId: tripRoomId,
      gasUrl: GAS_WEB_APP_URL,
      isSaving: false,

      // Fetch latest data from Google Sheets API
      fetchData: async function(onDataUpdate) {
        if (this.isSaving) return; // Skip fetch if currently saving to avoid race condition
        try {
          const res = await fetch(`${this.gasUrl}?trip=${encodeURIComponent(this.currentRoomId)}&action=get`);
          if (res.ok) {
            const json = await res.json();
            if (json && (json.data || json.itinerary)) {
              onDataUpdate(json.data || json);
              this.isReady = true;
            }
          }
        } catch (e) {
          console.warn("Google Sheets API fetch note:", e);
        }
      },

      // Initialize periodic auto-sync with Google Sheets
      init: function(onDataUpdate) {
        // Initial fetch
        this.fetchData(onDataUpdate);

        // Auto polling every 6 seconds to fetch updates from collaborators
        setInterval(() => {
          this.fetchData(onDataUpdate);
        }, 6000);
      },

      // Save payload data to Google Sheets API
      saveData: async function(payload) {
        this.isSaving = true;
        try {
          await fetch(this.gasUrl, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'save',
              trip: this.currentRoomId,
              timestamp: new Date().toISOString(),
              payload: payload
            })
          });
        } catch (err) {
          console.error("Google Sheets save error:", err);
          throw err;
        } finally {
          this.isSaving = false;
        }
      }
    };
  </script>

        return itinerary.reduce((sum, item) => sum + (Number(item.cost) || 0), 0);
      }, [itinerary]);

      const transportCost = React.useMemo(() => {
        return itinerary.reduce((sum, item) => {
          return item.transportIcon === 'fa-taxi' || item.transport.includes('地鐵') || item.cost > 0 
            ? sum + (Number(item.cost) || 0) 
            : sum;
        }, 0);
      }, [itinerary]);

      // Calculate total attractions (Pass + Extra entrance fees)
      const totalAttractionCost = totalPassCost + (extraItineraryCost - transportCost);

      const totalEstimatedExpense = totalFlightCost + totalHotelCost + foodBudget + transportCost + totalAttractionCost;
      const remainingBalance = totalBudget - totalEstimatedExpense;
      const budgetPercentage = Math.min(100, Math.round((totalEstimatedExpense / totalBudget) * 100));

      // Filtered Itinerary Memo
      const filteredItinerary = React.useMemo(() => {
        return itinerary.filter(item => {
          const matchDay = dayFilter === 'ALL' || item.day === Number(dayFilter);
          const matchStatus = statusFilter === 'ALL' || item.status === statusFilter;
          const matchSearch = searchTerm === '' || 
            item.activity.toLowerCase().includes(searchTerm.toLowerCase()) || 
            item.location.toLowerCase().includes(searchTerm.toLowerCase()) ||
            item.transport.toLowerCase().includes(searchTerm.toLowerCase());
          return matchDay && matchStatus && matchSearch;
        });

          window.GoogleSheetsStorage.init((sheetData) => {
            if (!sheetData) return;
            isRemoteUpdating.current = true;
            if (sheetData.totalBudget !== undefined) setTotalBudget(sheetData.totalBudget);
            if (sheetData.itinerary !== undefined) setItinerary(sheetData.itinerary);
            if (sheetData.hotelFlight !== undefined) setHotelFlight(sheetData.hotelFlight);
            if (sheetData.attractionPass !== undefined) setAttractionPass(sheetData.attractionPass);
            if (sheetData.foodBudget !== undefined) setFoodBudget(sheetData.foodBudget);
            if (sheetData.quickNotes !== undefined) setQuickNotes(sheetData.quickNotes);
            setSyncStatus('saved');
            setTimeout(() => { isRemoteUpdating.current = false; }, 400);
          });
        }

      const saveToCloud = React.useCallback((payload) => {
        if (window.GoogleSheetsStorage && !isRemoteUpdating.current) {

          window.GoogleSheetsStorage.saveData(payload)
            .then(() => setSyncStatus('saved'))
            .catch(() => setSyncStatus('offline'));

        saveToCloud({ itinerary: updated });

              <div className="flex items-center justify-between">
                <h3 className="text-sm font-bold text-white flex items-center gap-2">
                  <i className="fa-solid fa-note-sticky text-amber-400"></i> 行前隨手備忘錄
                </h3>
                <span className="text-[10px] text-slate-500">自動同步存至 Google 試算表</span>
              </div>
              <textarea
                value={quickNotes}
                onChange={(e) => {
                  setQuickNotes(e.target.value);
                  saveToCloud({ quickNotes: e.target.value });
                }}
                rows={3}
                className="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-3 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 leading-relaxed custom-scrollbar"
                placeholder="在這裡寫下隨身提醒、信用卡優惠或購物清單..."
              ></textarea>
            </div>
          </main>

          {}
          {showShareModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="glass-card max-w-md w-full p-6 rounded-3xl border border-slate-700 shadow-2xl relative">
                <button 
                  onClick={() => setShowShareModal(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-lg"
                >
                  <i className="fa-solid fa-xmark"></i>
                </button>

                <div className="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl mb-4 border border-emerald-500/30">
                  <i className="fa-solid fa-users"></i>
                </div>

                <h3 className="text-lg font-bold text-white mb-1">Google 試算表多人同步連結</h3>
                <p className="text-xs text-slate-400 mb-4 leading-relaxed">
                  複製下方專屬房間連結傳給同行好友，所有人開啟後皆可**即時讀取與共同修改您的 Google 試算表預算與行程**！
                </p>

                <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs text-emerald-400 font-mono break-all mb-4">
                  {window.location.href.split('?')[0]}?trip={window.GoogleSheetsStorage?.currentRoomId || 'singapore-3d2n-trip'}
                </div>

                <button
                  onClick={handleCopyShareLink}
                  className={`w-full py-3 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 ${
                    copySuccess ? 'bg-emerald-500 text-slate-950' : 'bg-emerald-600 hover:bg-emerald-500 text-white'
                  }`}
                >
                  {copySuccess ? <><i className="fa-solid fa-check"></i> 已複製連結！</> : <><i className="fa-solid fa-copy"></i> 複製多人同步連結</>}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
